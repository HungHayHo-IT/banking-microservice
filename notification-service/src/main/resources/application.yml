server:
  port: 8083
spring:
  application:
    name: "notification-service"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/notification-db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.notification_service.kafka.dto
        spring.json.type.mapping: com.user_account_service_service.kafka.dto.UserRegisteredEvent:com.notification_service.kafka.dto.UserRegisteredEvent,com.user_account_service_service.kafka.dto.BalanceUpdateEvent:com.notification_service.kafka.dto.BalanceUpdateEvent,com.transaction_service.kafka.dto.BalanceUpdateEvent:com.notification_service.kafka.dto.BalanceUpdateEvent
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true


eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    shutdown:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: "notification-service"
    version: "1.0.0"

app:
  kafka:
    topics:
      user-registered: user-registered-events
      balance-update-notification: balance-update-notification-events